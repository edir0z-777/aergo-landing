name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: il-central-1

jobs:
  deploy:
    name: Build & deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy site
        working-directory: infra
        run: npx cdk deploy AergoLandingDns AergoLandingCert AergoLandingSite --require-approval never --outputs-file cdk-outputs.json

      - name: Print site URL
        working-directory: infra
        run: |
          URL=$(node -p "require('./cdk-outputs.json').AergoLandingSite.SiteUrl")
          echo "Site deployed: $URL"
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
